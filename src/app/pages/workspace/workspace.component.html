
<div class="filter-container">
  <!-- Search Engine -->
    <!-- <input matInput (keyup)="applyFilter($event)" type="text" class="search-input" placeholder="{{ 'pages.workspace.search_by_name' | translate }}"/> -->
  <!-- Table searcher -->
  <mat-form-field appearance="outline" class="search-field custom-search-field search-engine">
      <!-- Search icon -->
      <mat-icon matPrefix class="search-icon">search</mat-icon>
      <!-- Input field -->
      <input matInput (keyup)="applyFilter($event)" type="text" class="search-input" placeholder="{{ 'pages.workspace.search_by_name' | translate }}"/>
  </mat-form-field>
  <!-- New Workspace -->
  <div class="new-workspace">
    <!-- New workspace button -->
    <button mat-button class="workspace-button"
    (click)="newWorkspace()"
    > 
    <mat-icon >add</mat-icon>
    {{'pages.workspace.new_workspace' | translate}} </button>
  </div>
</div>

<div class="content-containers">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    

    <!-- Workspace Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{'pages.workspace.workspace_name' | translate}}</th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Last Modification Column -->
    <ng-container matColumnDef="update_date">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{'pages.workspace.last_modification' | translate}}</th>
        <td mat-cell *matCellDef="let element" style="color: #596F79;"> {{element.update_date | date:'dd/MM/yyyy'}} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>{{'pages.workspace.status' | translate}}</th>
      <td mat-cell *matCellDef="let element"> 
        <div class="status-column" (click)="goToStatus(element.status)">
          {{element.status}} 
        </div>
      </td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>{{'pages.workspace.action' | translate}}</th>
      <td mat-cell *matCellDef="let element"> 
        <!-- Open workspace button -->
        <button mat-button class="open-button" (click)="openWorkspace(element)">
          <mat-icon>open_in_new</mat-icon>
          {{'pages.workspace.open' | translate}}
        </button>
        <!-- Delete button -->
        <button class="delete-button" (click)="deleteWorkspace(element)">
           <img
            src="./assets/images/icons/workspace/delete-icon.svg"
            alt="delete-icon"
            
          />
          
        </button>
      </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- Pagination -->
  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
</div>
