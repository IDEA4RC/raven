<div class="table-container" id="scrollbar1">
    <table mat-table [dataSource]="dataSourceAll" matSort class="mat-elevation-z8">
      <!-- Checkbox Column -->
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef class="p-l-0">
          <mat-checkbox
            (change)="$event ? masterToggle() : null"
            [checked]="selection.hasValue() && isAllSelected()"
            color="#99ABB4"
            [indeterminate]="selection.hasValue() && !isAllSelected()"
            [aria-label]="checkboxLabel()">
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row" class="p-l-0">
          <mat-checkbox
            (click)="$event.stopPropagation()"
            (change)="action(row)" 
            [checked]="selection.isSelected(row)"
            [aria-label]="checkboxLabel(row)">
          </mat-checkbox>
        </td>
  
      </ng-container>

      <!-- Variable Name Column -->
      <ng-container matColumnDef="variable_name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            
              {{'pages.metadata_search.all_variables' | translate}}
            
          </th>
          <td mat-cell *matCellDef="let element"> {{element.variable_name}} </td>
      </ng-container>

        <ng-container *ngFor="let center of centers" [matColumnDef]="center.center">
        <th mat-header-cell *matHeaderCellDef style="min-width: 150px; padding: 2px !important"> 
          <div class="header-center">
            <div class="center-name">
              {{ center.center }} 
            </div>
            <div class="center-years">
              ({{ center.years }})
            </div>
          </div>
          <div class="header-availability">
            <div class="availability-text">
              {{'pages.metadata_search.availability' | translate}}
            </div>
            <div class="availability-dpr">
              D <img style="padding: 5px;" src="./assets/images/icons/metadata-seach/bar.svg"/> P <img style="padding: 5px;" src="./assets/images/icons/metadata-seach/bar.svg"/> R
            </div>
          </div>
         </th>
         
        <td mat-cell *matCellDef="let element"> 
          <div style="display: flex; justify-content: center;">
            <div>
              <img *ngIf="this.checkAvailability(element, center.center, 'availability_d')" style="padding: 5px;" src="./assets/images/icons/metadata-seach/available-icon.svg"/>
              <img *ngIf="!this.checkAvailability(element, center.center, 'availability_d')" style="padding: 5px;" src="./assets/images/icons/metadata-seach/no-available-icon.svg"/>
            </div>
            <img style="padding: 5px;" src="./assets/images/icons/metadata-seach/available-icons-bar.svg"/>
            <div>
              <img *ngIf="this.checkAvailability(element, center.center, 'availability_p')" style="padding: 5px;" src="./assets/images/icons/metadata-seach/available-icon.svg"/>
              <img *ngIf="!this.checkAvailability(element, center.center, 'availability_p')" style="padding: 5px;" src="./assets/images/icons/metadata-seach/no-available-icon.svg"/>
            </div>
            <img style="padding: 5px;" src="./assets/images/icons/metadata-seach/available-icons-bar.svg"/>
            <div>
              <img *ngIf="this.checkAvailability(element, center.center, 'availability_r')" style="padding: 5px;" src="./assets/images/icons/metadata-seach/available-icon.svg"/>
              <img *ngIf="!this.checkAvailability(element, center.center, 'availability_r')" style="padding: 5px;" src="./assets/images/icons/metadata-seach/no-available-icon.svg"/>
            </div>
          </div>
        </td>

        </ng-container>

      
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <!-- Pagination -->
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
  </div>
