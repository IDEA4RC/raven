<!-- Table searcher -->
<mat-form-field appearance="outline" class="search-field custom-search-field">
    <!-- Search icon -->
    <mat-icon matPrefix class="search-icon">search</mat-icon>
    <!-- Input field -->
    <input matInput (keyup)="applyFilter($event)" type="text" class="search-input" placeholder="{{ 'pages.metadata_search.search_variable' | translate }}"/>
</mat-form-field>
